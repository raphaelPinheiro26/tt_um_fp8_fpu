name: formal
on: [push, workflow_dispatch]

jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Yosys + SymbiYosys (sby) + SMT solvers, via the YosysHQ oss-cad-suite.
      - name: Install OSS CAD Suite (yosys + sby)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2025-01-01'

      - name: Run formal proofs
        shell: bash
        run: |
          cd verification/formal
          chmod +x run.sh
          ./run.sh
