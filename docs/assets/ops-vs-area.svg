<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#0d1117"/>

  <!-- title -->
  <text x="80" y="120" fill="#e6edf3" font-size="62" font-weight="700">More operations.</text>
  <text x="80" y="196" fill="#3fb950" font-size="62" font-weight="700">Less silicon.</text>
  <text x="80" y="252" fill="#8b949e" font-size="27">FP8 (E4M3) floating-point unit · same RTL, same synthesis flow</text>

  <line x1="80" y1="300" x2="1120" y2="300" stroke="#30363d" stroke-width="2"/>

  <!-- ============ LEFT: operations ============ -->
  <text x="80" y="365" fill="#8b949e" font-size="26" font-weight="600" letter-spacing="2">OPERATIONS</text>

  <!-- before bar -->
  <rect x="80"  y="640" width="130" height="150" rx="6" fill="#30363d"/>
  <text x="145" y="615" fill="#8b949e" font-size="52" font-weight="700" text-anchor="middle">14</text>
  <text x="145" y="828" fill="#6e7681" font-size="24" text-anchor="middle">before</text>

  <!-- after bar -->
  <rect x="260" y="450" width="130" height="340" rx="6" fill="#3fb950"/>
  <text x="325" y="425" fill="#3fb950" font-size="52" font-weight="700" text-anchor="middle">18</text>
  <text x="325" y="828" fill="#6e7681" font-size="24" text-anchor="middle">after</text>

  <text x="80" y="890" fill="#e6edf3" font-size="27">+4 integer conversions</text>
  <text x="80" y="928" fill="#6e7681" font-size="23">int8 / uint8 ↔ fp8, RISC-V FCVT semantics</text>

  <!-- divider -->
  <line x1="620" y1="340" x2="620" y2="950" stroke="#30363d" stroke-width="2"/>

  <!-- ============ RIGHT: gates ============ -->
  <text x="690" y="365" fill="#8b949e" font-size="26" font-weight="600" letter-spacing="2">LOGIC GATES</text>

  <!-- before bar -->
  <rect x="690" y="450" width="130" height="340" rx="6" fill="#30363d"/>
  <text x="755" y="425" fill="#8b949e" font-size="52" font-weight="700" text-anchor="middle">5266</text>
  <text x="755" y="828" fill="#6e7681" font-size="24" text-anchor="middle">before</text>

  <!-- after bar -->
  <rect x="870" y="527" width="130" height="263" rx="6" fill="#3fb950"/>
  <text x="935" y="502" fill="#3fb950" font-size="52" font-weight="700" text-anchor="middle">4079</text>
  <text x="935" y="828" fill="#6e7681" font-size="24" text-anchor="middle">after</text>

  <text x="690" y="890" fill="#e6edf3" font-size="27">−22.5 %  ·  −18.6 % wire length</text>
  <text x="690" y="928" fill="#6e7681" font-size="23">datapath widths cut to their proven floor</text>

  <!-- ============ bottom band ============ -->
  <rect x="80" y="1000" width="1040" height="130" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="115" y="1052" fill="#e6edf3" font-size="30" font-weight="600">Verified over the complete input space</text>
  <text x="115" y="1096" fill="#8b949e" font-size="25">1,843,968 combinations · RTL and post-place-&amp;-route · nothing sampled</text>
</svg>
